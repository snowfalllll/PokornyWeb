<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Přihlášení do správy webu (CMS) | Pokorní z Příbora</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #232a32 0%, #14181d 100%);
      color: #faf7f2;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #faf7f2;
      color: #1f2421;
      border-radius: 10px;
      border: 2px solid #9e7b42;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }
    .login-header {
      background: #141920;
      color: #faf7f2;
      padding: 1.35rem 1.6rem;
      border-bottom: 2px solid #9e7b42;
    }
    .login-eyebrow {
      display: block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #d4b072;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .login-header h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 700;
      color: #faf7f2;
    }
    .login-body {
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }
    .login-desc {
      margin: 0;
      font-size: 0.88rem;
      line-height: 1.55;
      color: #5a605d;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .field label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #5a605d;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      padding: 0.68rem 0.85rem;
      font-size: 0.95rem;
      font-family: inherit;
      color: #1f2421;
      background: #ffffff;
      border: 1px solid #cbbba0;
      border-radius: 5px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      outline: none;
      border-color: #9e7b42;
      box-shadow: 0 0 0 3px rgba(158, 123, 66, 0.18);
    }
    .error-msg {
      display: none;
      background: rgba(155, 34, 38, 0.1);
      border-left: 3px solid #9b2226;
      color: #9b2226;
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.35rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.62rem 1.1rem;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      border-radius: 5px;
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-outline {
      background: transparent;
      color: #5a605d;
      border-color: #cbbba0;
    }
    .btn-outline:hover {
      background: #efe9dc;
      color: #1f2421;
    }
    .btn-primary {
      background: #9e7b42;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #846533;
    }
    .btn-primary:disabled {
      opacity: 0.65;
      cursor: wait;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="login-header">
      <span class="login-eyebrow">Pokorní z Příbora • Lékárna 1756</span>
      <h1>Přihlášení do editoru (CMS)</h1>
    </div>
    <form id="admin-login-form" class="login-body">
      <p class="login-desc">
        Zadejte administrátorské heslo pro odemknutí vizuálního editoru stránek, správy fotografií, časových os a interaktivního rodokmenu.
      </p>
      <div class="field">
        <label for="admin-pass">Přístupové heslo</label>
        <input type="password" id="admin-pass" placeholder="Zadejte heslo..." required autocomplete="current-password" autofocus />
      </div>
      <div id="admin-error" class="error-msg"></div>
      <div class="actions">
        <a href="index.html" id="back-to-public" class="btn btn-outline">← Zpět na veřejný web</a>
        <button type="submit" id="submit-btn" class="btn btn-primary">Přihlásit se a upravovat →</button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const rawReturn = params.get('return') || params.get('page') || 'index.html';
      const safeTarget = /^[a-zA-Z0-9_.-]+\.html(\?.*)?(#.*)?$/.test(rawReturn) ? rawReturn : 'index.html';

      function getRedirectUrlWithCms(target) {
        const url = new URL(target, window.location.href);
        url.searchParams.set('cms', '1');
        return url.toString();
      }

      // Check if already logged in on the server
      fetch('api.php?action=status', { credentials: 'same-origin' })
        .then(r => r.json())
        .then(data => {
          if (data && data.authenticated) {
            try { sessionStorage.setItem('pokorny_cms_mode', '1'); } catch (e) {}
            window.location.replace(getRedirectUrlWithCms(safeTarget));
          }
        })
        .catch(() => {});

      const form = document.getElementById('admin-login-form');
      const passInput = document.getElementById('admin-pass');
      const errBox = document.getElementById('admin-error');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Ověřuji…';

        try {
          const res = await fetch('api.php?action=login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            body: JSON.stringify({ password: passInput.value })
          });
          const data = await res.json();
          if (data && data.ok && data.authenticated) {
            try { sessionStorage.setItem('pokorny_cms_mode', '1'); } catch (e) {}
            window.location.replace(getRedirectUrlWithCms(safeTarget));
          } else {
            errBox.textContent = (data && data.error) ? data.error : 'Nesprávné heslo.';
            errBox.style.display = 'block';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Přihlásit se a upravovat →';
          }
        } catch (err) {
          errBox.textContent = 'Chyba spojení se serverem.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Přihlásit se a upravovat →';
        }
      });
    })();
  </script>
</body>
</html>
